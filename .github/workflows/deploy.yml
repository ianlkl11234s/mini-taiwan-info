# main 有新 commit 就 build 並部署到 Cloudflare Workers（取代 Zeabur）
# 需要 repo secrets：CLOUDFLARE_API_TOKEN（Edit Cloudflare Workers 權限）、
#   VITE_SUPABASE_URL、VITE_SUPABASE_ANON_KEY、VITE_MAPBOX_TOKEN（選填：VITE_API_BASE_URL、VITE_GA_ID、VITE_DEFAULT_THEME）
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 連續 push 時只保留最新一次，避免舊版本晚完成蓋掉新版本
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 專案強制 pnpm（CLAUDE.md），版本與原 Dockerfile 相同
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build
        # 這三個沒設時 build 仍會成功、但地圖與資料整個出不來，所以直接擋下
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::缺 secret VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::缺 secret VITE_SUPABASE_ANON_KEY"; exit 1; }
          test -n "$VITE_MAPBOX_TOKEN" || { echo "::error::缺 secret VITE_MAPBOX_TOKEN"; exit 1; }
          pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          VITE_DEFAULT_THEME: ${{ secrets.VITE_DEFAULT_THEME }}

      - name: Upload big file to R2
        # 大檔超過 Workers 靜態資產 25MiB 上限，放 R2 bucket site-assets，由 worker/index.ts 提供；每次部署都傳，保持與 main 同步
        # 需要 CLOUDFLARE_API_TOKEN 具 R2 寫入權限（Workers R2 Storage: Edit）
        run: pnpm exec wrangler r2 object put site-assets/mini-tw-info/data/forestry/forest_reserve.geojson --file public/data/forestry/forest_reserve.geojson --remote --content-type application/geo+json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d104f32eafd7b294ba1f74b731ffd1e0

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d104f32eafd7b294ba1f74b731ffd1e0
