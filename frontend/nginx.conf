# nginx configuration for Vite SPA on Zeabur
# - SPA fallback: all non-existent routes → /index.html
# - gzip compression
# - Layered cache-control: assets (long, immutable) / index.html (no-cache)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # nginx:alpine 預設以 non-root 友善方式運行；tmp 路徑避免權限問題
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # === Gzip compression ===
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml text/javascript
             application/x-javascript application/xml+rss
             application/json application/javascript
             application/yaml application/geo+json
             image/svg+xml font/woff font/woff2;
  gzip_comp_level 6;

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # === Cache-control strategies ===

    # 1. index.html: no-cache（每次都向 server 驗證新版本）
    location = /index.html {
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # 2. /assets/ 內的 hash 檔: 永久 immutable cache
    #    Vite build 為 JS/CSS/字型/圖片產出含 hash 檔名，版本變即換檔名
    location ~* ^/assets/.*\.(js|css|woff2?|png|jpg|jpeg|svg|gif|ico|webp)$ {
      add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    # 3. *.geo.json 邊界檔（460KB tw-counties 等）: 1 天 cache
    location ~* \.geo\.json$ {
      add_header Cache-Control "public, max-age=86400" always;
    }

    # 4. /data 與 /icons 等其他 public 靜態資源: 1 小時
    location ~* ^/(data|icons)/ {
      add_header Cache-Control "public, max-age=3600" always;
    }

    # === SPA Fallback ===
    # 檔案不存在時 fallback 到 /index.html（client-side routing）
    location / {
      try_files $uri $uri/ /index.html;
    }

    # === Error handling ===
    error_page 404 /index.html;
  }
}
