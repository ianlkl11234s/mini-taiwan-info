# nginx configuration for Vite SPA on Zeabur
# - SPA fallback: all non-existent routes → /index.html
# - gzip compression
# - Layered cache-control: assets (long, immutable) / index.html (no-cache)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # nginx:alpine 預設以 non-root 友善方式運行；tmp 路徑避免權限問題
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # === Gzip compression ===
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml text/javascript
             application/x-javascript application/xml+rss
             application/json application/javascript
             application/yaml application/geo+json
             image/svg+xml font/woff font/woff2;
  gzip_comp_level 6;

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # === Security headers ===
    # ⚠️ nginx add_header 繼承規則：location 內只要有「任何一個」add_header，
    #    就完全不繼承 server 層的 add_header。因此下面每個有 Cache-Control 的
    #    location 都必須「重複」這 5 個 security header，否則該 location 會漏掉。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # HSTS：Zeabur 已有 TLS，先不加 includeSubDomains / preload（保守起步）
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- CSP 草稿（暫不啟用）---
    # 白名單（Mapbox worker/blob + Supabase + Google Fonts）尚未經線上驗證，
    # 貿然啟用會炸站（Mapbox GL 需要 worker-src blob: + child-src blob:，
    # 且 telemetry / tiles / sprite 網域清單需實測）。待 staging 以
    # Content-Security-Policy-Report-Only 驗證通過後再解開。
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.mapbox.com; connect-src 'self' https://*.mapbox.com https://events.mapbox.com https://utcmcikhvxnohbxchbrs.supabase.co; worker-src blob:; child-src blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # === Cache-control strategies ===

    # 1. index.html: no-cache（每次都向 server 驗證新版本）
    location = /index.html {
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
      # security headers（location 有 add_header 就不繼承 server 層，必須重複）
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 2. /assets/ 內的 hash 檔: 永久 immutable cache
    #    Vite build 為 JS/CSS/字型/圖片產出含 hash 檔名，版本變即換檔名
    location ~* ^/assets/.*\.(js|css|woff2?|png|jpg|jpeg|svg|gif|ico|webp)$ {
      add_header Cache-Control "public, immutable, max-age=31536000" always;
      # security headers（同上，必須重複）
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 3. *.geo.json 邊界檔（460KB tw-counties 等）: 1 天 cache
    location ~* \.geo\.json$ {
      add_header Cache-Control "public, max-age=86400" always;
      # security headers（同上，必須重複）
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 4. /data 與 /icons 等其他 public 靜態資源: 1 小時
    location ~* ^/(data|icons)/ {
      add_header Cache-Control "public, max-age=3600" always;
      # security headers（同上，必須重複）
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # === SPA Fallback ===
    # 檔案不存在時 fallback 到 /index.html（client-side routing）
    location / {
      try_files $uri $uri/ /index.html;
    }

    # === Error handling ===
    error_page 404 /index.html;
  }
}
