# Mini Taiwan Info · Water Resources Theme Manifest
# 詳規見 docs/themes/water.md
# 規格 SSOT: docs/04-theme-manifest-spec.md v1.1+
# 資料端 SSOT: taipei-gis-analytics/docs/systems/water_tic.md
# 縣市 SSOT: data/counties.yaml

theme:
  id: water
  name: 水資源
  name_en: Water Resources
  emoji: 💧
  icon: drop                       # lucide-react
  color_accent: "#0EA5E9"          # sky-500
  color_ramp: blues
  description: 縣市水資源狀況：水庫、河川、用水、污水、防洪、地下水。
  tagline: 南北分裂的島嶼水帳
  priority: 5
  status: production

# ─────────────────────────────────────────────────
# View A 全國概覽
# ─────────────────────────────────────────────────
overview:
  default_choropleth_metric: lpcd

  # 「著色指標」選單（TwoSectionLayers radio）
  color_metrics:
    - id: lpcd
      label: 人均日用水量
      unit: L
      ramp_direction: reverse      # LPCD 低=好
      domain: [180, 340]
    - id: reservoir_rate
      label: 蓄水率
      unit: "%"
      ramp_direction: default
      domain: [25, 100]
    - id: sewage_coverage
      label: 汙水接管率
      unit: "%"
      ramp_direction: default
      domain: [0, 100]
    - id: rain_24hr
      label: 24hr 均雨量
      unit: mm
      ramp_direction: default
      domain: [0, 45]
    - id: flood_high_risk_pct
      label: 淹水高潛勢面積
      unit: "%"
      ramp_direction: reverse      # 淹水佔比低=好
      domain: [0, 35]
    - id: river_alert_pct          # Cycle E：警戒站佔比（縣市內達一級以上警戒站 / 有警戒門檻設定站）
      label: 河川警戒站佔比
      unit: "%"
      ramp_direction: reverse      # 警戒站越少越好
      domain: [0, 50]

  kpis:
    # 即時排（realtime group）
    - id: total_reservoir_rate
      label: 全國蓄水率
      unit: "%"
      group: realtime
      source: wra_reservoir_realtime
      query: aggregate_national_reservoir_rate
      format:
        precision: 1
        compare_to: previous_day
        sentiment_when_up: positive
      response_shape:
        value: number
        delta: number
        spark: number[30]
      explode:
        - mode: dimension
          by: reservoir
          default: true
          response_shape:
            items: [{ id: string, name: string, value: number, county_id: string }]
        - mode: time
          windows: [30d, 1y, all]
          response_shape:
            series: [{ x: timestamp, y: number }]

    - id: rain_24hr_avg
      label: 24hr 全國均雨量
      unit: mm
      group: realtime
      source: wra_rain_gauge
      query: aggregate_national_rain_24hr
      format:
        precision: 1
        compare_to: previous_day
        sentiment_when_up: neutral
      response_shape:
        value: number
        delta: number
        spark: number[30]
      explode:
        - mode: dimension
          by: county
          default: true
          response_shape:
            items: [{ id: string, name: string, value: number }]
        - mode: time
          windows: [7d, 30d]

    - id: high_alert_reservoirs
      label: 高警戒水庫數
      unit: 座
      group: realtime
      source: wra_reservoir_realtime
      query: count_reservoirs_below_30pct
      format:
        precision: 0
        compare_to: previous_day
        sentiment_when_up: negative
      response_shape:
        value: number
        delta: number
      explode:
        - mode: dimension
          by: reservoir
          default: true
          response_shape:
            items: [{ id: string, name: string, value: number, county_id: string, consecutive_days_down: number }]

    - id: flood_high_risk_pct
      label: 淹水高潛勢面積佔比
      unit: "%"
      group: realtime
      source: nldcb_flood_hazard
      query: aggregate_national_flood_pct
      format:
        precision: 1
        compare_to: previous_week
        sentiment_when_up: negative
      meta:
        scenario_switcher: ["200mm/24hr", "350mm/24hr", "500mm/24hr"]
      response_shape:
        value: number
        delta: number
      explode:
        - mode: dimension
          by: county
          response_shape:
            items: [{ id: string, name: string, value: number }]
        - mode: geo
          level: township

    # 治理排（governance group）
    - id: lpcd
      label: 全國平均 LPCD
      unit: L
      group: governance
      source: datagov_8316
      query: aggregate_national_lpcd
      format:
        precision: 0
        compare_to: previous_year
        sentiment_when_up: negative   # LPCD 上升是壞事
      response_shape:
        value: number
        delta: number
        spark: number[16]            # 16 年歷年
      explode:
        - mode: dimension
          by: county
          default: true
          response_shape:
            items: [{ id: string, name: string, value: number }]
        - mode: time
          windows: [10y, all]
          response_shape:
            series: [{ x: integer, y: number }]
            annotations: [{ at_index: int, label: string, severity: string }]

    - id: sewage_coverage
      label: 全國接管率
      unit: "%"
      group: governance
      source: datagov_26815
      query: aggregate_national_sewage_coverage
      format:
        precision: 1
        compare_to: previous_year
        sentiment_when_up: positive
      response_shape:
        value: number
        delta: number
        spark: number[10]
      explode:
        - mode: dimension
          by: county
          default: true
          response_shape:
            items: [{ id: string, name: string, value: number }]
        - mode: time
          windows: [10y, all]

  # 點位概況面板（PointProfile）
  point_profile:
    enabled: true
    title: 全國 40 座主要水庫
    source: water_reservoirs_with_status
    query: list_reservoirs_with_status
    response_shape:
      items:
        - id: string
          name: string
          value: number             # 蓄水率 %
          county_id: string         # 對應 data/counties.yaml id_moi
          region: string            # north/central/south/east/island
          capacity: number          # 萬 m³
          lat: number
          lng: number
    modes:
      - id: bucket
        label: 蓄水率分布
        type: bucket
        thresholds:
          - { lt: 30,  label: 紅線, color: "#EF4444" }
          - { lt: 60,  label: 警示, color: "#F59E0B" }
          - { gte: 60, label: 充足, color: "#10B981" }
      - id: region
        label: 按地理區
        type: region
        groups_from: data/counties.yaml
      - id: scatter
        label: 容量 × 蓄水率
        type: scatter
        x_axis: { field: capacity, label: 容量, unit: 萬m³, scale: log }
        y_axis: { field: value,    label: 蓄水率, unit: "%", scale: linear }
        bands:
          - { y_lt: 30,  color: "#FEF2F2" }
          - { y_lt: 60,  color: "#FFFBEB" }
          - { y_gte: 60, color: "#ECFDF5" }
    default_mode: bucket

  hook_rules:
    - id: drought_ratio
      condition: "ratio_max_min_lpcd > 1.5"
      template: "用水量縣市差異 {ratio} 倍 · 最高 {max_county} {max_value}L · 最低 {min_county} {min_value}L"
      severity: warn
    - id: reservoir_red_line
      condition: "reservoirs_below_30pct > 3"
      template: "全國 {n} 座水庫跌破 30% 紅線（{region_name} {region_n} 座）"
      severity: danger
    - default:
      template: "全國蓄水率 {total}% · 平均日用水 {lpcd}L · 接管率 {coverage}%"
      severity: info

  ranking:
    primary_metric: lpcd
    available_metrics: [lpcd, sewage_coverage, water_pollution_fines, flood_high_risk_pct]
    top_n: 5
    bottom_n: 5

# ─────────────────────────────────────────────────
# View B 縣市儀錶板
# ─────────────────────────────────────────────────
county_dashboard:
  hero:
    facts:
      - { source: pop_2024_wan,      suffix: 萬人,    format: num1 }
      - { source: area_km2,          suffix: km²,     format: num }
      - { source: reservoir_count,   suffix: 座水庫,  format: num }
      - { source: wwtp_count,        suffix: 座汙水廠, format: num }

  default_tab: overview

  # IA v2 (Cycle B, 2026-05-14)：依「水循環層」重組 7 tabs
  #   1. 概覽       — 總覽 stat + LPCD donut
  #   2. 水庫       — 蓄積 Storage（含水庫水質）
  #   3. 河川       — 流量 + 環境（含河川水質）
  #   4. 地下水     — 補注 / 蓄積（含地下水質）
  #   5. 防洪       — 災害 Disaster
  #   6. 用水與配送 — Consumption + Distribution（合併原「基礎設施」+「用水 & 衛生」）
  #   7. 排名       — 跨縣比較
  # 取消：原「水質」獨立 tab、原「基礎設施」獨立 tab
  tabs:
    - id: overview
      label: 概覽
      icon: globe
      type: charts
      layers: [river_basins, river_lines, reservoirs_point]
      kpis: [county_reservoir_count, county_wwtp_count, county_lpcd, county_sewage_coverage]
      charts:
        - id: county_reservoir_30d
          type: trend
          query: county_reservoir_status_30d
          response_shape:
            series: [{ x: timestamp, y: number }]
            annotations?: array
          windows: [30d, 90d, 1y]

    - id: reservoirs
      label: 水庫
      icon: droplet
      type: charts
      layers: [reservoirs_point, reservoir_polygons]
      kpis: [county_reservoir_rate, county_reservoir_water_quality_do]
      charts:
        - id: reservoirs_individual_30d
          type: trend_multi
          query: county_reservoir_each_30d
          group_by: reservoir_id
          response_shape:
            series: [{ name: string, color: string, data: [{ x, y }] }]
          windows: [30d, 1y]
        - id: reservoir_water_quality
          type: station_ranking
          query: get_water_quality_county_summary
          query_args: { p_param: "DO", p_station_type: "reservoir" }
          response_shape:
            items: [{ county_id, avg_value, n_stations, n_readings, latest_sampled_at }]
      explore_links:
        - to: "dataset/reservoir/:id"
          when: click_point_on_map

    - id: rivers
      label: 河川
      icon: activity
      type: charts
      layers: [river_lines, river_basins, river_flow_stations, water_quality_stations]
      kpis: [county_river_flow, county_river_water_quality_do, county_rpi]
      charts:
        - id: river_water_quality
          type: station_ranking
          query: get_water_quality_county_summary
          query_args: { p_param: "DO", p_station_type: "river" }
          response_shape:
            items: [{ county_id, avg_value, n_stations, n_readings, latest_sampled_at }]
        - id: rpi_yearly
          type: trend
          query: county_rpi_yearly
          response_shape:
            series: [{ x: integer, y: number }]
      meta:
        coverage_notes:
          - dataset: epa_river_readings
            reason: "河川 station 表 446 站已建，但 reading 待 Cycle A2 補抓 (epa_river:siteid via wqx_p_01)"
            ui_treatment: warning_badge

    - id: groundwater
      label: 地下水
      icon: layers
      type: charts
      layers: [groundwater_zones, groundwater_level_stations, water_quality_stations]
      kpis: [county_groundwater_level, county_groundwater_quality_do]
      charts:
        - id: groundwater_water_quality
          type: station_ranking
          query: get_water_quality_county_summary
          query_args: { p_param: "DO", p_station_type: "groundwater" }
        - id: groundwater_level_realtime
          type: stations_latest
          query: get_groundwater_level_latest
          response_shape:
            items: [{ station_id, name, county_id, lat, lng, level_m, observed_at }]
      meta:
        coverage_notes:
          - dataset: groundwater_zones
            affected_counties: [A, F, H, O, J, K, B, N, M, P, Q, I, D, E, T]
            mode: only_in
            reason: "地下水分區僅西部 9 區"

    - id: flood
      label: 防洪
      icon: cloud-rain
      type: charts
      layers: [flood_hazard_zones, detention_basins, storm_drainage_pipes, rain_gauges]
      kpis: [county_flood_high_risk_pct, county_detention_basin_count]
      meta:
        scenario_switcher: ["200mm", "350mm", "500mm"]
        coverage_notes:
          - dataset: storm_drainage_pipes
            affected_counties: [A, H, I]
            mode: only_in
            ui_treatment: warning_badge
          - dataset: detention_basins
            affected_counties: [A, F, H]
            mode: only_in
            ui_treatment: warning_badge

    - id: supplies
      label: 用水與配送
      icon: recycle
      type: charts
      layers: [water_facilities, sewage_treatment_plants]
      kpis: [county_lpcd, county_sewage_coverage, county_wwtp_count, county_water_penetration]
      charts:
        - id: lpcd_history
          type: trend
          query: county_lpcd_history
          response_shape:
            series: [{ x: integer, y: number }]
          windows: [10y, all]
        - id: sewage_history
          type: trend
          query: county_sewage_history
          response_shape:
            series: [{ x: integer, y: number }]
          windows: [10y]
      meta:
        # 原「基礎設施」tab 內容（自來水普及率 / 漏水率 / 給水設施 / 汙水廠）併入此處
        coverage_notes:
          - metric: water_loss_rate
            reason: "漏水率無 22 縣市對齊版（台水全國 + 北水單市）"
            ui_treatment: placeholder
          - metric: industrial_water_usage
            affected_counties: [A, F, B, D, E]
            mode: only_in
            ui_treatment: warning_badge

    - id: ranking
      label: 排名
      icon: trending-up
      type: ranking_panel
      metrics: [lpcd, sewage_coverage, water_pollution_fines, flood_high_risk_pct, reservoir_rate, river_water_quality_do]

# ─────────────────────────────────────────────────
# View C 資料集詳情
# ─────────────────────────────────────────────────
datasets:
  - id: reservoir
    label: 水庫
    layer: point
    source_table: water_reservoirs
    detail_fields:
      - { key: name,                          label: 水庫名稱 }
      - { key: built_year,                    label: 啟用年 }
      - { key: full_water_level_m,            label: 滿水位, unit: m }
      - { key: total_capacity_million_m3,     label: 總容量, unit: 萬 m³ }
      - { key: effective_capacity_million_m3, label: 有效容量, unit: 萬 m³ }
      - { key: catchment_area_km2,            label: 集水區, unit: km² }
      - { key: supply_area,                   label: 主要供水 }
    timeseries:
      - source: realtime.reservoir_status
        x: snapshot_at
        y: storage_rate_pct
        label: 蓄水率
        annotations_from: reservoir_events
      - source: realtime.reservoir_status
        x: snapshot_at
        y: water_level_m
        label: 水位
    events:
      source: reservoir_events
      response_shape:
        items: [{ date: date, severity: string, text: string }]
    download:
      csv: "/api/dataset/reservoir/:id/csv"
      api: "/api/dataset/reservoir/:id"

  - id: water_quality_station
    label: 水質測站
    layer: point
    source_table: water_quality_stations
    detail_fields:
      - { key: station_name, label: 測站名稱 }
      - { key: river_name,   label: 所在河川 }
    timeseries:
      - source: water_quality_readings
        x: sample_date
        y: bod_mgl
        label: BOD
      - source: water_quality_readings
        x: sample_date
        y: do_mgl
        label: DO

# ─────────────────────────────────────────────────
# View D 比較模式
# ─────────────────────────────────────────────────
compare:
  comparable_metrics:
    - id: lpcd
      label: 人均日用水量
      unit: L
      source: datagov_8316
      ranking_better: lower
    - id: sewage_coverage
      label: 污水接管率
      unit: "%"
      source: datagov_26815
      ranking_better: higher
    - id: water_pollution_fines_per_capita
      label: 水污染罰鍰實收 / 萬人
      unit: 元
      source: datagov_45136
      ranking_better: higher
    - id: flood_high_risk_pct
      label: 淹水高潛勢面積佔比
      unit: "%"
      source: nldcb_flood_hazard
      ranking_better: lower
    - id: realtime_reservoir_rate
      label: 即時蓄水率
      unit: "%"
      source: wra_reservoir_realtime
      ranking_better: higher
      coverage_note: 限有水庫的縣市

# ─────────────────────────────────────────────────
# 跨主題聯動
# ─────────────────────────────────────────────────
crosslink:
  - with: demographics
    metric_pair: [lpcd, aging_index]
    trigger: "abs(corr(lpcd, aging_index)) > 0.3"
    template: "{county} 高齡 {aging}% vs 全國 {national_aging}% · LPCD {lpcd}L"

  - with: demographics
    metric_pair: [sewage_coverage, urbanization_rate]
    trigger: always
    template: "接管率 {coverage}% · 都市化率 {urban}% · 差距反映建設滯後"

# ─────────────────────────────────────────────────
# 地圖圖層目錄
# ─────────────────────────────────────────────────
layers_catalog:
  - id: river_basins
    type: polygon
    source: public.river_basins
    style: { stroke: "#94A3B8", fill: "rgba(148,163,184,0.1)" }
  - id: river_lines
    type: line
    source: public.river_lines
    style: { color: "#7DD3FC", width: 1 }
  - id: reservoirs_point
    type: point
    source: water_reservoirs_with_status
    style:
      mode: rate
      label_min_zoom: 7.6
      thresholds:
        - { lt: 30, color: "#EF4444" }
        - { lt: 60, color: "#F59E0B" }
        - { gte: 60, color: "#10B981" }
  - id: reservoir_polygons
    type: polygon
    source: public.reservoir_polygons
    style: { stroke: "#0369A1", fill: "rgba(56,189,248,0.2)" }
  - id: water_quality_stations
    type: point
    source: public.water_quality_stations
    style: { color: "#A855F7", radius: 3 }
  - id: water_pollution_entities
    type: point
    source: public.water_pollution_entities
    style: { color: "#EF4444", radius: 2 }
  - id: flood_hazard_zones
    type: polygon
    source: public.flood_hazard_zones
    style: { stroke: "#DC2626", fill: "rgba(220,38,38,0.18)" }
  - id: detention_basins
    type: polygon
    source: public.detention_basins
    style: { stroke: "#0EA5E9", fill: "rgba(14,165,233,0.2)" }
  - id: rain_gauges
    type: point
    source: realtime.rain_gauge_readings
    style: { color: "#10B981", radius: 3 }
  - id: water_facilities
    type: point
    source: public.water_facilities
    style: { color: "#64748B", radius: 3, shape: square }
  - id: sewage_treatment_plants
    type: point
    source: public.sewage_treatment_plants
    style: { color: "#475569", radius: 3, shape: square }

# ─────────────────────────────────────────────────
# 資料來源
# ─────────────────────────────────────────────────
data_sources:
  - id: wra_reservoir_realtime
    title: 即時水庫蓄水
    license: OGDL-Taiwan-1.0
    url: https://fhy.wra.gov.tw/ReservoirPage_2011/StorageCapacity.aspx
    updated_field: snapshot_at
    refresh_cadence: hourly
    supabase_tables: [realtime.reservoir_status, public.reservoir_situation_v]

  - id: wra_rain_gauge
    title: 即時雨量站
    license: OGDL-Taiwan-1.0
    url: https://fhy.wra.gov.tw/fhy/Monitor/Rainfall
    updated_field: observed_at
    refresh_cadence: realtime
    supabase_tables: [realtime.rain_gauge_readings]

  - id: datagov_8316
    title: 自來水生活用水量統計（縣市 × 年 LPCD）
    license: OGDL-Taiwan-1.0
    url: https://data.gov.tw/dataset/8316
    updated_field: stat_year
    refresh_cadence: yearly
    supabase_tables: [public.water_usage_yearly]   # 待 Phase 0c-2 建表

  - id: datagov_26815
    title: 污水下水道用戶接管普及率（22 縣市）
    license: OGDL-Taiwan-1.0
    url: https://data.gov.tw/dataset/26815
    updated_field: stat_year
    refresh_cadence: yearly
    supabase_tables: [public.sewage_coverage_yearly]   # 待 Phase 0c-3 建表

  - id: datagov_45134
    title: 水污染稽查次數（22 縣市）
    license: OGDL-Taiwan-1.0
    url: https://data.gov.tw/dataset/45134
    updated_field: stat_year
    refresh_cadence: yearly

  - id: datagov_45135
    title: 水污染罰鍰次數（22 縣市）
    license: OGDL-Taiwan-1.0
    url: https://data.gov.tw/dataset/45135
    updated_field: stat_year
    refresh_cadence: yearly

  - id: datagov_45136
    title: 水污染實收罰鍰（22 縣市）
    license: OGDL-Taiwan-1.0
    url: https://data.gov.tw/dataset/45136
    updated_field: stat_year
    refresh_cadence: yearly

  - id: datagov_35644
    title: 農田水利署各管理處實際灌溉用水量（18 處）
    license: OGDL-Taiwan-1.0
    url: https://data.gov.tw/dataset/35644
    updated_field: stat_year
    refresh_cadence: yearly
    note: 18 水利會處別 → 縣市 proxy

  - id: env_rpi
    title: 重要河川污染情形 RPI
    license: OGDL-Taiwan-1.0
    url: https://data.gov.tw/dataset/89034

  - id: nldcb_flood_hazard
    title: 淹水潛勢圖（10 情境）
    license: OGDL-Taiwan-1.0
    url: https://dpp.nldcb.gov.tw/
    refresh_cadence: static
    supabase_tables: [public.flood_hazard_zones, public.flood_hazard_pct_by_county]
    note: 內政部國土署、水利署聯合

# ─────────────────────────────────────────────────
# Meta
# ─────────────────────────────────────────────────
meta:
  version: "1.1.0"
  spec_version: "1.1.0"            # 對齊 docs/04 spec
