# Mini Taiwan Info · Fire / Public Safety Theme Manifest
# v2 (2026-05-15) — 對齊 designs/v03-fire-design-brief-2026-05-15/SPEC.md
# Backend SSOT: taipei-gis-analytics/docs/systems/fire_tic.md
# DB schema:    gis-platform/migrations/099_fire_schema.sql

theme:
  id: fire
  name: 消防
  name_en: Fire & Public Safety
  emoji: 🚒
  icon: flame
  color_accent: "#DC2626"        # red-600
  color_ramp: reds
  description: 火災事件、救災量能、量能落差、其他救護山林 — 對齊 v03 設計 4 區塊。
  tagline: 島嶼的火帳分四章看完
  priority: 6
  status: production

# ─────────────────────────────────────────────────
# overview：對應 ViewA fire 4 區塊（火災發生 / 救災 / 交叉 / 其他）
# ─────────────────────────────────────────────────
overview:
  default_choropleth_metric: fire_density_per_wan

  color_metrics:
    - id: fire_density_per_wan
      label: 火災密度
      unit: 件/萬人
      ramp_direction: default        # 越高越紅
      domain: [0, 15]
    - id: station_density_per_wan
      label: 分隊密度
      unit: 隊/萬人
      ramp_direction: reverse        # 越高越好（綠）
      domain: [0, 14]
    - id: out_of_5min_pct
      label: 5min 圈外人口
      unit: "%"
      ramp_direction: default
      domain: [0, 30]
    - id: hydrant_density_per_km2
      label: 消防栓密度
      unit: 個/km²
      ramp_direction: reverse
      domain: [0, 120]

  kpis:
    # ───── 區塊 1 火災發生 (3 real + 1 placeholder 待 MOI ETL) ─────
    - id: yearly_incidents
      label: 年度火災件數
      unit: 件
      source: datagov_13764
      query: fire_aggregate_latest_year
      group: structural
      format: { precision: 0, compare_to: previous_year, sentiment_when_up: negative }
      explode:
        - mode: dimension
          by: county
          default: true
        - mode: dimension
          by: cause
        - mode: time
          windows: [1y, 3y, 10y]

    - id: yearly_deaths_injuries
      label: 死亡 / 受傷
      unit: 人
      source: datagov_13764
      query: fire_aggregate_latest_year
      group: safety
      format: { precision: 0, compare_to: previous_year, sentiment_when_up: negative }

    - id: yearly_damage_million
      label: 火災財損
      unit: 億
      source: moi_stats_casualty_property
      query: fire_damage_million_placeholder
      group: structural
      format: { precision: 1, compare_to: previous_year, sentiment_when_up: negative }
      coverage_note: "等內政部統計處 5 表 ETL（Sprint 1 TODO-3）"

    - id: top_cause_5_pct
      label: 主因佔比
      unit: "%"
      source: datagov_13764
      query: fire_top_cause_5_latest
      group: structural
      format: { precision: 1, compare_to: none, sentiment_when_up: neutral }

    # ───── 區塊 2 火災救災 (待 Sprint 2 ETL) ─────
    - id: stations_total
      label: 消防分隊
      unit: 個
      source: county_fire_stations
      query: fire_stations_count_placeholder
      group: structural
      format: { precision: 0, compare_to: none, sentiment_when_up: positive }
      coverage_note: "等 Sprint 2 分隊 ETL（TODO-5/6/7）"

    - id: hydrants_total
      label: 消防栓
      unit: 個
      source: county_fire_hydrants
      query: fire_hydrants_count_placeholder
      group: structural
      format: { precision: 0, compare_to: none, sentiment_when_up: positive }
      coverage_note: "限北/中/南/高 4 都，等 Sprint 2 ETL（TODO-8）"

    # ───── 區塊 3 火災交叉量能（衍生指標，待 Sprint 3） ─────
    - id: stations_per_wan
      label: 分隊密度
      unit: 隊/萬人
      source: derived_stations_density
      query: fire_stations_density_placeholder
      group: structural
      format: { precision: 2, compare_to: none, sentiment_when_up: positive }
      coverage_note: "Sprint 3 PostGIS 衍生"

    - id: stations_per_100km2
      label: 分隊面積密度
      unit: 隊/100km²
      source: derived_stations_density
      query: fire_stations_density_placeholder
      group: structural
      format: { precision: 2, compare_to: none, sentiment_when_up: positive }
      coverage_note: "Sprint 3 衍生"

    - id: out_of_5min_pct
      label: 5min 圈外人口比
      unit: "%"
      source: derived_service_coverage
      query: fire_service_coverage_placeholder
      group: structural
      format: { precision: 1, compare_to: none, sentiment_when_up: negative }
      coverage_note: "Sprint 3 ST_Buffer × demographics"

    # ───── 區塊 4 其他救災救護山林火山 (Sprint 4) ─────
    - id: ems_trips_yearly
      label: 年救護出勤
      unit: 次
      source: moi_ems_stats
      query: fire_ems_yearly_placeholder
      group: structural
      format: { precision: 0, compare_to: previous_year, sentiment_when_up: neutral }
      coverage_note: "等 Sprint 4 救護統計 ETL（TODO-10）"

    - id: emergency_hospitals_count
      label: 急救責任醫院
      unit: 家
      source: mohw_emergency_hospitals
      query: fire_emergency_hospitals_placeholder
      group: structural
      format: { precision: 0, compare_to: none, sentiment_when_up: positive }
      coverage_note: "衛福部全國名冊缺口，雲林 only"

    - id: forest_fire_risk_points
      label: 山林火災高風險點
      unit: 處
      source: datagov_24394
      query: fire_forest_risk_placeholder
      group: structural
      format: { precision: 0, compare_to: none, sentiment_when_up: negative }
      coverage_note: "snapshot import（Sprint 4 TODO-11）"

  hook_rules:
    - id: top_cause_severity
      condition: "top_cause_severity == 'high'"
      template: "主因「{top_cause_5_name}」屬高致死率類別（{top_cause_5_pct}%）— 需特別關注。"
      severity: warn
    - id: deaths_up_yoy
      condition: "deaths_delta > 0"
      template: "今年死亡人數較去年多 {deaths_delta} 人，需檢視防火政策。"
      severity: warn
    - default: true
      template: "島嶼的火帳，分四章看完。年度火災 {yearly_incidents} 件、死亡 {total_deaths}、受傷 {total_injuries}。"
      severity: info

  ranking:
    primary_metric: yearly_incidents
    available_metrics:
      - yearly_incidents
      - fire_density_per_wan
      - stations_per_wan
      - out_of_5min_pct
    top_n: 10
    bottom_n: 3

# ─────────────────────────────────────────────────
# county_dashboard：View B（後續 session 細化 — 對應設計 5 tabs）
# ─────────────────────────────────────────────────
county_dashboard:
  default_tab: overview
  tabs:
    - id: overview
      label: 概覽
      icon: flame
      type: charts
      kpis: [yearly_incidents, yearly_deaths_injuries, stations_total, out_of_5min_pct]
    - id: incidents
      label: 火災發生
      icon: alert-triangle
      type: charts
      kpis: [yearly_incidents, top_cause_5_pct, yearly_damage_million]
    - id: response
      label: 救災量能
      icon: shield
      type: charts
      kpis: [stations_total, hydrants_total]
    - id: service
      label: 服務圈
      icon: target
      type: map_only
      kpis: [stations_per_wan, out_of_5min_pct]
    - id: others
      label: 其他救護
      icon: heart-pulse
      type: charts
      kpis: [ems_trips_yearly, emergency_hospitals_count, forest_fire_risk_points]

# ─────────────────────────────────────────────────
# layers_catalog：地圖圖層（始終 on + toggle）
# ─────────────────────────────────────────────────
layers_catalog:
  - id: fire_incidents_heatmap
    type: point
    source: datagov_13764
    style: { color: "#F97316", radius: 3, shape: "circle" }

  - id: fire_stations_point
    type: point
    source: county_fire_stations
    style: { color: "#DC2626", radius: 5, shape: "circle" }

  - id: fire_hydrants_point
    type: point
    source: county_fire_hydrants
    style: { color: "#0EA5E9", radius: 3, shape: "square" }

  - id: fire_service_buffer
    type: polygon
    source: derived_service_coverage
    style: { fill: "#FCD34D", stroke: "#F59E0B" }

# ─────────────────────────────────────────────────
# data_sources
# ─────────────────────────────────────────────────
data_sources:
  - id: datagov_13764
    title: 內政部消防署 — 火災事件
    license: 政府資料開放授權條款第 1 版
    url: https://data.gov.tw/dataset/13764
    refresh_cadence: yearly
    supabase_tables: [fire.incidents]
    note: "111-113 年 48,657 筆，TGOS 命中 74.4%，剩 109-102 待批次補抓"

  - id: moi_stats_casualty_property
    title: 內政部統計處 — 行政區火災死傷財損
    license: 政府資料開放授權條款
    url: https://www.moi.gov.tw/cl.aspx?n=2887
    refresh_cadence: yearly
    note: "Sprint 1 待 ETL（TODO-3）"

  - id: county_fire_stations
    title: 各縣市消防分隊駐地（多 dataset 整合）
    license: 政府資料開放授權條款
    url: https://data.gov.tw/search?q=%E6%B6%88%E9%98%B2%E5%88%86%E9%9A%8A
    refresh_cadence: static
    note: "7 都 datagov + 15 縣市 user 蒐集名冊（374 筆）+ Google geocoding（Sprint 2）"

  - id: county_fire_hydrants
    title: 各縣市消防栓位置（限北/中/南/高 4 都）
    license: 政府資料開放授權條款
    url: https://data.gov.tw/search?q=%E6%B6%88%E9%98%B2%E6%A0%93
    refresh_cadence: yearly
    note: "Sprint 2 ETL"

  - id: derived_stations_density
    title: (衍生) 縣市分隊密度
    license: 衍生自 county_fire_stations
    url: ""
    refresh_cadence: static
    supabase_tables: [fire.stations_density_by_county]
    note: "Sprint 3"

  - id: derived_service_coverage
    title: (衍生) 5min/10min 服務圈外人口
    license: 衍生自 county_fire_stations × demographics
    url: ""
    refresh_cadence: static
    supabase_tables: [fire.service_coverage_by_county]
    note: "Sprint 3 PostGIS ST_Buffer"

  - id: moi_ems_stats
    title: 內政部 — 救護出勤統計
    license: 政府資料開放授權條款
    url: ""
    refresh_cadence: yearly
    note: "Sprint 4"

  - id: mohw_emergency_hospitals
    title: 衛福部 — 急救責任醫院（缺口）
    license: 政府資料開放授權條款
    url: ""
    refresh_cadence: yearly
    note: "Sprint 4，全國 catalog 缺，需手爬"

  - id: datagov_24394
    title: 農業部 — 林火風險評估資訊
    license: 政府資料開放授權條款
    url: https://data.gov.tw/dataset/24394
    refresh_cadence: daily
    note: "Snapshot only（不設 cron），Sprint 4"

# ─────────────────────────────────────────────────
