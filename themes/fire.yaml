      reason: "消防栓資料只有北/中/南/高 4 都開放，其他 18 縣市無公開資料"
    - dataset: mohw_emergency_hospitals
      affected_counties: [A, F, H, T, B, J, O, K, M, N, P, Q, I, D, E, G, U, C, V, X, W, Z]
      mode: only_in
      ui_treatment: placeholder
      reason: "衛福部全國急救醫院 catalog 缺，僅雲林 datagov:174552 有"
    - metric: out_of_5min_pct
      affected_counties: []
      mode: pending_geocode
      ui_treatment: placeholder
      reason: "Sprint 3 PostGIS ST_Buffer 衍生表完成後上線"
    - metric: yearly_damage_million
      affected_counties: []
      mode: pending_geocode
      ui_treatment: placeholder
