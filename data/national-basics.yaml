    unit: "人"
    source: "內政部戶政司「全國人口資料庫統計月報」"
    source_url: "https://www.ris.gov.tw/app/portal/346"
    tier: monthly
    as_of: "2026-04"

  male:
    value: 11439382
    unit: "人"
    tier: monthly
    as_of: "2026-04"

  female:
    value: 11823162
    unit: "人"
    tier: monthly
    as_of: "2026-04"

  sex_ratio:
    value: 96.75
    label: "性比例（男/女 × 100）"
    unit: "%"
    tier: monthly
    as_of: "2026-04"

  density:
    value: 642.66
    label: "人口密度"
    unit: "人/km²"
    note: "= total / total_area_km2"
    tier: monthly
    as_of: "2026-04"

  households:
    value: 9894000
    label: "戶數"
    unit: "戶"
    confidence: low  # 推算自戶量 + 總人口
    note: "≈ total / 2.3509（戶量）"
    tier: monthly
    as_of: "2026-04"

  household_size:
    value: 2.3509
    label: "平均戶量"
    unit: "人/戶"
    tier: monthly
    as_of: "2026-04"

