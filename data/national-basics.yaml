# Mini Taiwan Info · 全國基礎統計 SSOT
# 用於首頁「全台概覽 · 基礎統計」KPI 卡片 + 文案
#
# 設計原則：
#   - tier=static：固定值（行政區、面積），人工檢視，年度確認一次
#   - tier=yearly：年度更新，一次性 import 即可（戶政司年報 / SEGIS）
#   - tier=monthly：月度更新，B 階段做半動態 pipeline（不走 collector cron）
#
# 數字來源權威優先順序：
#   1. 內政部戶政司「人口統計資料」(www.ris.gov.tw)         — 人口、出生、死亡、性比例（月）
#   2. 內政部統計處「內政統計年報 / 通報」(www.moi.gov.tw)   — 行政區、面積、海岸線（年）
#   3. 內政部統計處 SEGIS (segis.moi.gov.tw)                 — 行政區人口指標、老化（年）
#   4. 內政部國土測繪中心 (www.nlsc.gov.tw)                  — 邊界、地形（年）
#
# 數值同步紀錄：
#   2026-05-20  初版 — baseline 來自內政部戶政司 2026-04 月底 + Wikipedia 彙整

meta:
  version: "1.0"
  last_updated: "2026-05-20"
  last_verified_against_source: "2026-05-20"
  next_review: "2026-08-20"  # 每季人工確認一次，動態值更頻繁
  authority: "中華民國內政部"

# ─────────────────────────────────────────────────
# Section A · 行政區（tier=static，幾乎不變）
# ─────────────────────────────────────────────────
administrative:
  # 一級
  cities_total:
    value: 22
    label: "縣市總數"
    breakdown:
      municipality: 6       # 直轄市：北、新北、桃、中、南、高
      provincial_city: 3    # 市：基隆、新竹、嘉義
      county: 13            # 縣
    source: "內政部「直轄市縣市行政區劃」"
    source_url: "https://www.moi.gov.tw"
    note: "2014/12/25 桃園升格後固定至今"
    tier: static
    as_of: "2026-05"

  # 二級
  townships_total:
    value: 368
    label: "鄉鎮市區總數"
    breakdown:
      district: 170          # 區（含 6 山地原住民區）
      county_city: 14        # 縣轄市
      town: 38               # 鎮
      township: 122          # 鄉
      mountain_township: 24  # 山地鄉
    source: "內政部統計處 SEGIS「行政區人口統計」"
    source_url: "https://segis.moi.gov.tw"
    tier: static
    as_of: "2026-05"

  # 三級
  villages_total:
    value: 7748
    label: "村里總數"
    source: "內政部戶政司「鄉鎮市區村里鄰數」"
    source_url: "https://www.ris.gov.tw/app/portal/346"
    note: "緩變指標，每年小幅調整（合併/分區），baseline 為 2024 年底數字"
    tier: yearly
    as_of: "2024-12"

  # 四級
  neighborhoods_total:
    value: 144820
    label: "鄰總數"
    source: "內政部戶政司「鄉鎮市區村里鄰數」"
    tier: yearly
    as_of: "2024-12"

# ─────────────────────────────────────────────────
# Section B · 國土面積（tier=static）
# ─────────────────────────────────────────────────
territory:
  total_area_km2:
    value: 36197.06
    label: "總面積"
    unit: "km²"
    source: "內政部統計年報「臺灣面積及海岸長度」+ 國土測繪中心"
    note: "含臺灣本島、澎湖、金門、馬祖；不含領海"
    tier: static

  main_island_area_km2:
    value: 35808.0
    label: "臺灣本島面積"
    unit: "km²"
    source: "內政部國土測繪中心"
    tier: static

  offshore_islands_area_km2:
    value: 389.06
    label: "離島總面積"
    unit: "km²"
    breakdown:
      penghu: 126.86          # 澎湖
      kinmen: 151.66          # 金門
      lienchiang: 28.80       # 馬祖（連江）
      orchid_green_etc: 81.74 # 蘭嶼、綠島、小琉球…
    source: "內政部統計年報「臺灣島嶼位置及面積」"
    tier: static

  inland_water_area_km2:
    value: 74.6
    label: "內陸水域面積"
    unit: "km²"
    note: "湖泊、水庫、河川等地表水域（不含領海）；國土利用調查約值"
    source: "內政部「國土利用調查成果」"
    tier: static
    confidence: medium  # 各來源略有差異（35–95 km² 之間，因水域定義不同）

  coastline_length_km:
    value: 1988
    label: "海岸線總長"
    unit: "km"
    note: "含本島 + 主要離島；潮汐基準線量測"
    source: "內政部國土測繪中心 / 海洋委員會"
    tier: static

  highest_elevation_m:
    value: 3952.43
    label: "最高峰（玉山）"
    unit: "m"
    source: "國土測繪中心 1/5000 數值地形"
    tier: static

  largest_natural_lake_km2:
    value: 8.0
    label: "最大天然湖泊（日月潭）"
    unit: "km²"
    tier: static

# ─────────────────────────────────────────────────
# Section C · 人口（tier=monthly，B 階段做 pipeline）
# ─────────────────────────────────────────────────
population:
