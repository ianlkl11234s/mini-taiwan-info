# Mini Taiwan Info · 22 縣市 SSOT (Single Source of Truth)
#
# 這張表是整個專案的縣市代碼基底，所有後續開發只認這張表：
#   - frontend/src/lib/counties.ts （TypeScript 衍生）
#   - gis-platform/migrations/093_reference_counties.sql （Supabase reference.counties 載入）
#   - taipei-gis-analytics/pipelines/*  （pipeline 內 county 欄位 normalize）
#   - themes/*.yaml coverage_notes.counties[] （這裡用 slug）
#
# 設計考量：
#   - id_moi 是內政部「鄉鎮市區代碼」最高位字母（VARCHAR(2)，與 admin.counties.county_id 對齊，docs/09 §A）
#   - code3 是視覺友善的 3 字母（前綴自 IATA / postal 慣例，前端 state 用）
#   - slug 是英文 URL（/c/kaohsiung）
#   - name_zh 用「臺」（內政部標準），name_zh_alt 用「台」（民眾通俗）
#   - region 用 5 區（north/central/south/east/island）— PointProfile by-region 用這欄
#   - centroid_lng/lat 來自 prototype data.js v02，正式上線會被 NLSC boundary centroid 覆寫
#   - pop_2024 是參考值（10 萬人為單位）— 真實值走戶政司 pipeline
#
# 維護規則：
#   - 此檔修改後，必須跑 `scripts/regen-counties.sh` 重新生成衍生檔
#   - 不要直接編輯衍生檔
#   - id_moi 一旦發佈不可變（即使 2010 五都升格那種事，新增不刪除）
#
# 版本：1.0.0  (2026-05-14)
# Reviewer: migu

